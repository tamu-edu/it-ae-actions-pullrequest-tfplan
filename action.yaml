name: 'Terraform Plan to Pull Request'
description: 'This workflow will generate and post a terraform plan to a pull request.'
inputs:
  debug:
    description: Debug workflow with tmate if an error occurs
    required: false
    default: "false"
  GITHUB_TOKEN:
    description: GitHub token for access to the pull request
    required: true
  save-artifact:
    description: Save the terraform plan as an artifact (May contain sensitive data)
    required: false
    default: "false"
  working-directory:
    description: Working directory for the `run` actions
    required: false
    default: ''
  terraform-version:
    description: Version of terraform to install
    required: false
    default: latest
  terraform-workspace:
    description: Terraform workspace to select. Must already exist 
    required: false
    default: default
  terraform-init-flags:
    description: CLI flags to use with terraform init
    required: false
    default: ""
  terraform-plan-flags:
    description: CLI flags to use with terraform plan
    required: false
    default: ""
  workflow-artifact-name:
    description: Provides a unique name to append to the plan artifact attached to this workflow run. Default tfplan
    required: false
    default: "tfplan"


outputs:
  plan:
    description: 'The plan output'
    value: ${{ format('Plan output saved to files - {0} bytes total', steps.plan-output.outputs.content-size) }}
  artifact:
    description: 'The file name of the terraform plan artifact'
    value: "pr-${{ github.event.pull_request.number }}-tfplan"
runs:
  using: "composite"
  steps:
    - name: setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}

    - name: install terraform-plan-summary
      shell: bash
      run: |
        REPO="dineshba/terraform-plan-summary"
        curl -LO https://github.com/$REPO/releases/latest/download/tf-summarize_linux_amd64.tar.gz
        tmpDir=$(mktemp -d -t tmp.XXXXXXXXXX)
        mv tf-summarize_linux_amd64.tar.gz $tmpDir
        cd $tmpDir
        tar -xzf tf-summarize_linux_amd64.tar.gz
        chmod +x tf-summarize
        echo $PWD >> $GITHUB_PATH

    - name: Terraform Init
      id: init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # Create temp files for capturing output to avoid ARG_MAX issues
        INIT_STDOUT_FILE=$(mktemp)
        INIT_STDERR_FILE=$(mktemp)
        
        # Run terraform init with tee to capture output to files while still showing in logs
        set +e  # Don't exit on terraform init errors
        terraform init ${{ inputs.terraform-init-flags }} 2> >(tee "$INIT_STDERR_FILE" >&2) | tee "$INIT_STDOUT_FILE"
        INIT_EXIT_CODE=$?
        set -e
        
        # Store file paths in outputs for later use
        echo "stdout-file=$INIT_STDOUT_FILE" >> $GITHUB_OUTPUT
        echo "stderr-file=$INIT_STDERR_FILE" >> $GITHUB_OUTPUT
        echo "exitcode=$INIT_EXIT_CODE" >> $GITHUB_OUTPUT
        
        # Set exit code for continue-on-error handling
        exit $INIT_EXIT_CODE

    - name: Process terraform init output
      id: init-output
      shell: bash
      run: |
        # Create combined output file for the file-based interface
        INIT_COMBINED_FILE="${{ github.workspace }}/terraform-init-output.txt"
        
        # Combine stdout and stderr into a single file
        cat "${{ steps.init.outputs.stdout-file }}" > "$INIT_COMBINED_FILE"
        if [ -s "${{ steps.init.outputs.stderr-file }}" ]; then
          echo "" >> "$INIT_COMBINED_FILE"  # Add newline if there's stderr content
          cat "${{ steps.init.outputs.stderr-file }}" >> "$INIT_COMBINED_FILE"
        fi
        
        # Set output with file path for the new file-based interface
        echo "stdout-file=$INIT_COMBINED_FILE" >> $GITHUB_OUTPUT
        
        # Clean up temp files
        rm -f "${{ steps.init.outputs.stdout-file }}" "${{ steps.init.outputs.stderr-file }}"

    - name: Post Init
      if: ${{ github.event_name == 'pull_request' }}
      uses: tamu-edu/it-ae-actions-terraform-pr-commenter@copilot/fix-argument-list-error
      with:
        commenter_type: init
        commenter_input_file: ${{ steps.init-output.outputs.stdout-file }}
        commenter_exitcode: ${{ steps.init.outputs.exitcode }}
      env:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        TF_WORKSPACE: ${{ inputs.terraform-workspace }}

    - name: Terraform Plan
      id: plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TF_WORKSPACE: ${{ inputs.terraform-workspace }}
        TF_IN_AUTOMATION: "true"
      run: |
        # Create temp files for capturing output to avoid ARG_MAX issues
        PLAN_STDOUT_FILE=$(mktemp)
        PLAN_STDERR_FILE=$(mktemp)
        
        # Run terraform plan with tee to capture output to files while still showing in logs
        set +e  # Don't exit on terraform plan errors
        terraform plan -out=tfplan -input=false ${{ inputs.terraform-plan-flags }} 2> >(tee "$PLAN_STDERR_FILE" >&2) | tee "$PLAN_STDOUT_FILE"
        PLAN_EXIT_CODE=$?
        set -e
        
        # Store file paths in outputs for later use
        echo "stdout-file=$PLAN_STDOUT_FILE" >> $GITHUB_OUTPUT
        echo "stderr-file=$PLAN_STDERR_FILE" >> $GITHUB_OUTPUT
        echo "exitcode=$PLAN_EXIT_CODE" >> $GITHUB_OUTPUT
        
        # Set exit code for continue-on-error handling
        exit $PLAN_EXIT_CODE
      continue-on-error: true

    - name: Process terraform plan output safely
      id: plan-output
      shell: bash
      run: |
        # Create combined output file for the file-based interface
        PLAN_COMBINED_FILE="${{ github.workspace }}/terraform-plan-output.txt"
        
        # Combine stdout and stderr into a single file
        cat "${{ steps.plan.outputs.stdout-file }}" > "$PLAN_COMBINED_FILE"
        if [ -s "${{ steps.plan.outputs.stderr-file }}" ]; then
          echo "" >> "$PLAN_COMBINED_FILE"  # Add newline if there's stderr content
          cat "${{ steps.plan.outputs.stderr-file }}" >> "$PLAN_COMBINED_FILE"
        fi
        
        # Calculate content size for reporting
        TOTAL_SIZE=$(wc -c < "$PLAN_COMBINED_FILE")
        
        echo "Terraform plan output size: $TOTAL_SIZE bytes"
        echo "Using file-based approach to avoid ARG_MAX issues"
        
        # Set outputs with file path for the new file-based interface
        echo "stdout-file=$PLAN_COMBINED_FILE" >> $GITHUB_OUTPUT
        echo "content-size=$TOTAL_SIZE" >> $GITHUB_OUTPUT
        
        # Clean up temp files
        rm -f "${{ steps.plan.outputs.stdout-file }}" "${{ steps.plan.outputs.stderr-file }}"

    - name: generate tf-summarize table
      id: summary
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TF_WORKSPACE: ${{ inputs.terraform-workspace }}
      run: |
        EOF=$(openssl rand -hex 8)

        echo "table<<$EOF" >> $GITHUB_OUTPUT
        terraform-bin show -json tfplan | tf-summarize -md >> $GITHUB_OUTPUT
        echo "$EOF" >> $GITHUB_OUTPUT

    - name: Post terraform plan
      if: ${{ github.event_name == 'pull_request' }}
      uses: tamu-edu/it-ae-actions-terraform-pr-commenter@copilot/fix-argument-list-error
      with:
        commenter_type: plan
        commenter_input_file: ${{ steps.plan-output.outputs.stdout-file }}
        commenter_exitcode: ${{ steps.plan.outputs.exitcode }}
        comment_prepend: ${{ steps.summary.outputs.table }}
      env:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        TF_WORKSPACE: ${{ inputs.terraform-workspace }}

    - name: Save Artifact
      id: save-artifact
      if: ${{ inputs.save-artifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: pr-${{ github.event.pull_request.number }}-${{ inputs.workflow-artifact-name }}
        path: ${{ github.workspace }}/${{ inputs.working-directory }}/tfplan
      env:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}

    - name: Debug with TMATE if the debug environment variable is set to "true" and something failed
      if: ${{ (failure() || steps.plan.outcome == 'failure') && inputs.debug == 'true' }}
      uses: mxschmitt/action-tmate@v3

    - name: Workflow Run Status
      shell: bash
      if: steps.plan.outcome == 'failure'
      run: exit 1
